<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sheep · instalação</title>
<link rel="icon" href="rosto.jpg">
<link rel="stylesheet" href="estilo.css">
<style>
body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);overflow:hidden}
.esq{position:relative;display:flex;align-items:flex-end;justify-content:center}
.esq::before{content:"";position:absolute;inset:10% 0 0;background:radial-gradient(circle at 50% 45%,#e0102f55,transparent 60%);animation:respira 4s ease-in-out infinite}
@keyframes respira{50%{opacity:.6;transform:scale(1.06)}}
.esq img{position:relative;max-height:92vh;filter:drop-shadow(0 0 40px #e0102f66);animation:acorda 1.2s cubic-bezier(.2,1.4,.4,1) both}
.esq img.falando{animation:pulsoFala 1s ease-in-out infinite}
@keyframes pulsoFala{50%{filter:drop-shadow(0 0 48px #e0102f99) brightness(1.08)}}
@keyframes acorda{from{transform:translateY(60px) scale(.9);opacity:0}}
.dir{padding:56px 56px 40px 24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.cabecalho{display:flex;align-items:center;justify-content:space-between;gap:12px}.cabecalho #som{padding:8px;font-size:18px;letter-spacing:0}
.trilha{display:flex;gap:6px}.trilha i{flex:1;height:4px;background:var(--line)}.trilha i.f{background:var(--red)}.trilha i.a{background:var(--fg)}
h1{font:400 clamp(56px,7vw,104px)/.86 var(--display);text-transform:uppercase}
h1 .ponto{color:var(--red)}
.fala{font:600 22px/1.35 var(--body);border-left:3px solid var(--red);padding-left:14px;min-height:2.7em}
.log{flex:1;min-height:120px;max-height:32vh;overflow:auto;background:var(--s1);border:1px solid var(--line);padding:12px;font:13px/1.6 var(--mono);color:var(--dim)}
.log b{color:var(--ok);font-weight:600}.log em{color:var(--red);font-style:normal}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.extra{display:grid;gap:10px}
.palavra{position:fixed;inset:0;display:grid;place-items:center;font:400 22vw/1 var(--display);color:var(--red);pointer-events:none;opacity:0}
.palavra.v{animation:bate .7s ease-out}
@keyframes bate{0%{opacity:1;transform:scale(1.4);filter:blur(8px)}30%{filter:none;transform:scale(1)}100%{opacity:0}}
/* cabe em tela pequena: a coluna da direita rola e o botão fica preso no rodapé */
html,body{height:100%}body{height:100vh}.dir{height:100vh;overflow-y:auto;padding:clamp(20px,5vh,56px) 40px 0 24px}.acoes{position:sticky;bottom:0;background:var(--bg);padding:12px 0 20px}h1{font-size:clamp(40px,min(7vw,9vh),104px)}.log{min-height:80px;max-height:22vh}
</style></head><body class="instalador">
<div class="esq"><img id="sheep" src="sheep.png" alt="A Sheep"></div>
<div class="dir">
  <div class="cabecalho"><div class="rot" id="contador">Preparando…</div><button id="som" class="sec" aria-label="Desligar narração" aria-pressed="true">🔊</button></div>
  <div class="trilha" id="trilha"></div>
  <h1 id="titulo">Oi<span class="ponto">.</span></h1>
  <p class="fala" id="fala"></p>
  <div class="extra" id="extra"></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="acoes"><button id="seguir">Bora</button><button class="sec" id="tentar" hidden>Tentar de novo</button><button class="sec" id="pular" hidden>Pular por enquanto</button></div>
</div>
<div class="palavra" id="palavra"></div>
<script src="instalador.js"></script></body></html>
