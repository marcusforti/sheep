<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sheep · instalação</title>
<link rel="icon" href="rosto.jpg">
<link rel="stylesheet" href="estilo.css">
<style>
html,body{height:100%}
body{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.25fr);height:100vh;overflow:hidden;background:radial-gradient(circle at 18% 60%,#2a060d 0,#0a0708 52%)}
.esq{position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.esq::before{content:"";position:absolute;inset:10% 0 0;background:radial-gradient(circle at 50% 45%,#e0102f55,transparent 60%);animation:respira 4s ease-in-out infinite}
@keyframes respira{50%{opacity:.6;transform:scale(1.06)}}
.esq img{position:relative;max-height:92vh;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 40px #e0102f66);animation:acorda 1.2s cubic-bezier(.2,1.4,.4,1) both}
.esq img.falando{animation:pulsoFala 1s ease-in-out infinite}
@keyframes pulsoFala{50%{filter:drop-shadow(0 0 48px #e0102f99) brightness(1.08)}}
@keyframes acorda{from{transform:translateY(60px) scale(.9);opacity:0}}
.dir{height:100vh;overflow-y:auto;scrollbar-gutter:stable;display:flex;flex-direction:column;gap:clamp(12px,2.4vh,22px);justify-content:center;padding:clamp(20px,5vh,52px) clamp(24px,5vw,64px) clamp(16px,3vh,28px) 16px;min-width:0}
.cabecalho{display:flex;align-items:center;gap:14px}
.progresso{flex:1;min-width:0}
.progresso .rot{display:flex;justify-content:space-between;font:600 13px var(--body);color:var(--fg2);text-transform:none;letter-spacing:0;margin-bottom:7px}
.barra{height:6px;border-radius:99px;background:var(--s3);overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--red2));box-shadow:0 0 12px #e0102f99;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cabecalho #som{width:40px;height:40px;padding:0;border-radius:50%;font-size:17px;letter-spacing:0;flex-shrink:0}
h1{margin:0;font:400 clamp(38px,min(6.2vw,8.5vh),92px)/.92 var(--display);text-transform:uppercase}
h1 .ponto{color:var(--red)}
.fala{margin:0;font:600 clamp(16px,2.4vh,21px)/1.4 var(--body);color:var(--fg);min-height:2.8em}
.status{display:none;align-items:center;gap:10px;font:600 15px var(--body);color:var(--fg2)}
.status.on{display:flex}
.status i,.etapas li.rodando span{width:18px;height:18px;border-radius:50%;border:2.5px solid #ffffff2b;border-top-color:var(--red2);animation:gira .8s linear infinite;flex-shrink:0}
.etapas li.rodando span{font-size:0;background:none;box-shadow:none}
@keyframes gira{to{transform:rotate(360deg)}}
.alerta{display:none;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid #e0102f88;border-radius:12px;background:var(--redsoft);font:600 15px/1.4 var(--body)}
.alerta.on{display:flex}
.alerta::before{content:"!";flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:800;font-size:14px}
.extra{display:grid;gap:10px}
.extra:empty{display:none}
.extra p{margin:0}
.extra a{color:var(--red2)}
.nota{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);font-size:14px;color:var(--fg2)}
.loginMotor{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);font-weight:600}
.loginMotor .resultado{flex-basis:100%;font-weight:400;font-size:14px;color:var(--fg2);text-transform:none}
.loginMotor .resultado:empty{display:none}
.loginMotor .acoesMotor{margin-left:auto;display:flex;gap:8px}
.etapas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.etapas li{display:flex;align-items:center;gap:10px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#ffffff06;color:var(--dim);font:600 13.5px/1.2 var(--body);transition:border-color .3s,background .3s,color .3s}
.etapas span{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--s3);color:var(--fg2);font:800 12px var(--body)}
.etapas li.agora{border-color:var(--red);background:var(--redsoft);color:var(--fg)}
.etapas li.agora span{background:var(--red);color:#fff}
.etapas li.rodando{border-color:var(--red);background:var(--redsoft);color:var(--fg)}
.etapas li.feito{color:var(--fg2)}
.etapas li.feito span{background:var(--ok);color:#06180e}
.etapas li.pulado span{background:var(--s3);color:var(--dim)}
.etapas li.falhou{border-color:var(--red2);color:var(--fg)}
.etapas li.falhou span{background:var(--red2);color:#fff}
details{font:13px var(--body);color:var(--dim)}
summary{cursor:pointer;width:max-content;padding:2px 0}
summary:hover{color:var(--fg2)}
.log{margin-top:8px;max-height:20vh;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--s1);font:12.5px/1.6 var(--mono);color:var(--dim);overflow-wrap:anywhere}
.log:empty::before{content:"Nada por aqui ainda."}
.log b{color:var(--ok);font-weight:600}.log em{color:var(--red2);font-style:normal}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acoes button{min-height:48px;padding:0 28px;border-radius:12px;font-size:16px;font-weight:800}
.acoes #seguir{background:var(--red);min-width:150px;box-shadow:0 8px 24px #e0102f55}
.acoes #seguir:hover:not(:disabled){background:var(--red2)}
.acoes button[hidden]{display:none}
.palavra{position:fixed;inset:0;display:grid;place-items:center;font:400 22vw/1 var(--display);color:var(--red);pointer-events:none;opacity:0}
.palavra.v{animation:bate .7s ease-out}
@keyframes bate{0%{opacity:1;transform:scale(1.4);filter:blur(8px)}30%{filter:none;transform:scale(1)}100%{opacity:0}}
@media (max-width:820px){body{grid-template-columns:minmax(0,1fr)}.esq{display:none}.etapas{grid-template-columns:repeat(2,minmax(0,1fr))}.dir{padding-left:clamp(20px,5vw,40px);padding-right:clamp(20px,5vw,40px)}}
@media (max-height:640px){.fala{min-height:0}.etapas li{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){.esq::before,.esq img,.palavra.v{animation:none}.status i,.etapas li.rodando span{animation-duration:2.4s}}
</style></head><body class="instalador">
<div class="esq"><img id="sheep" src="sheep.png" alt="A Sheep"></div>
<div class="dir">
  <div class="cabecalho">
    <div class="progresso"><div class="rot"><span id="contador">Preparando…</span><span id="porcento"></span></div><div class="barra"><i id="barra"></i></div></div>
    <button id="som" class="sec" aria-label="Desligar narração" aria-pressed="true">🔊</button>
  </div>
  <h1 id="titulo">Oi<span class="ponto">.</span></h1>
  <p class="fala" id="fala"></p>
  <div class="status" id="status" role="status"><i></i><span id="statusTexto"></span></div>
  <div class="alerta" id="alerta" role="alert"><span id="alertaTexto"></span></div>
  <div class="extra" id="extra"></div>
  <div class="acoes"><button id="seguir">Bora</button><button id="tentar" hidden>Tentar de novo</button><button class="sec" id="pular" hidden>Pular por enquanto</button></div>
  <ol class="etapas" id="trilha"></ol>
  <details><summary>Ver detalhes técnicos</summary><div class="log" id="log" aria-live="polite"></div></details>
</div>
<div class="palavra" id="palavra"></div>
<script src="instalador.js"></script></body></html>
